framework:
    html_sanitizer:
        sanitizers:
            app.note_sanitizer:
                allow_safe_elements: false
                allow_elements:
                    p: '*'
                    br: '*'
                    strong: '*'
                    em: '*'
                    u: '*'
                    h1: '*'
                    h2: '*'
                    h3: '*'
                    h4: '*'
                    h5: '*'
                    h6: '*'
                    ul: '*'
                    ol: '*'
                    li: '*'
                    blockquote: '*'
                    a: 'href,title'
                    code: '*'
                    pre: '*'
                    span: 'style'
                    div: 'style'
